<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Technische Basis des SandFPV-Browsersimulators"
    />
    <title>SandFPV</title>
  </head>
  <body>
    <div id="app">
      <canvas
        id="simulator"
        aria-label="3D-Ansicht des FPV-Simulators"
      ></canvas>
      <div id="crosshair" class="crosshair" aria-hidden="true"></div>
      <div class="flight-panels">
        <nav class="mode-selector" aria-label="Flugmodus">
          <button data-mode="free-flight">FREE FLIGHT</button>
          <button data-mode="first-gates">FIRST GATES</button>
          <button data-mode="race">RACE</button>
        </nav>
        <aside id="lesson" class="lesson-panel" aria-live="polite"></aside>
        <aside id="race-panel" class="race-panel" aria-live="polite" hidden>
          <header><small>FÜNF-GATE-KURS</small><strong>RACE</strong></header>
          <div class="race-time" id="race-time">00:00.000</div>
          <dl>
            <div>
              <dt>BESTZEIT</dt>
              <dd id="best-time">–</dd>
            </div>
            <div>
              <dt>RUNDEN</dt>
              <dd id="race-laps">0</dd>
            </div>
          </dl>
        </aside>
        <aside class="hud">
          <header>
            <strong>SAND<span>FPV</span></strong
            ><b id="camera-mode">FPV</b>
          </header>
          <dl class="telemetry">
            <dt>THR</dt>
            <dd id="motor-state">0%</dd>
            <dt>FPS</dt>
            <dd id="fps">--</dd>
            <dt>GATE</dt>
            <dd id="gate-state">1 / 5</dd>
            <dt>RUNDEN</dt>
            <dd id="lap-state">0</dd>
            <dt>ROLL</dt>
            <dd id="hud-roll">+0.00</dd>
            <dt>PITCH</dt>
            <dd id="hud-pitch">+0.00</dd>
            <dt>YAW</dt>
            <dd id="hud-yaw">+0.00</dd>
          </dl>
          <small>START / C: KAMERA · R: RESET</small>
        </aside>
        <aside class="debug-panel" aria-label="Flight Controller Debug">
          <strong>FLIGHT CONTROLLER</strong>
          <small>ROLL / PITCH / YAW</small>
          <dl id="flight-debug"></dl>
        </aside>
      </div>
      <aside
        id="stick-visualizer"
        class="stick-visualizer"
        aria-label="Mode-2 Stick-Anzeige"
      >
        <div class="stick"><i id="left-stick"></i><span>YAW / THR</span></div>
        <div class="stick">
          <i id="right-stick"></i><span>ROLL / PITCH</span>
        </div>
      </aside>
      <button id="reset" class="reset-button">DROHNE RESETTEN</button>
      <button id="open-tuning" class="tuning-button">DROHNE TUNEN</button>
      <button id="open-settings" class="settings-button">EINSTELLUNGEN</button>
      <button id="calibrate" class="calibrate-button">INPUT KALIBRIEREN</button>
      <aside class="controller-panel" aria-label="Controller Inspector">
        <div class="controller-panel__title">
          <div>
            <span>INPUT</span>
            <h2>CONTROLLER INSPECTOR</h2>
          </div>
          <span class="live-badge">LIVE</span>
        </div>
        <div id="controllers" aria-live="polite"></div>
      </aside>
      <div id="calibration" class="wizard-layer" hidden></div>
      <div id="tuning" class="wizard-layer" hidden></div>
      <div id="settings" class="wizard-layer" hidden></div>
      <div id="loading" role="status">Simulator wird initialisiert …</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
