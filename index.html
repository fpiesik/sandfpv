<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Technische Basis des SandFPV-Browsersimulators"
    />
    <title>SandFPV</title>
  </head>
  <body>
    <div id="app">
      <canvas
        id="simulator"
        aria-label="3D-Ansicht des FPV-Simulators"
      ></canvas>
      <div class="flight-panels">
        <aside class="hud">
          <header>
            <strong>SAND<span>FPV</span></strong
            ><b id="camera-mode">FPV</b>
          </header>
          <dl class="telemetry">
            <dt>THR</dt>
            <dd id="motor-state">0%</dd>
            <dt>FPS</dt>
            <dd id="fps">--</dd>
            <dt>ROLL</dt>
            <dd id="hud-roll">+0.00</dd>
            <dt>PITCH</dt>
            <dd id="hud-pitch">+0.00</dd>
            <dt>YAW</dt>
            <dd id="hud-yaw">+0.00</dd>
          </dl>
          <div class="camera-settings">
            <label
              >ANGLE <output id="camera-angle-value">20°</output
              ><input
                id="camera-angle"
                type="range"
                min="0"
                max="60"
                value="20"
            /></label>
            <label
              >FOV <output id="camera-fov-value">95°</output
              ><input
                id="camera-fov"
                type="range"
                min="60"
                max="130"
                value="95"
            /></label>
            <label class="visualizer-option"
              ><input id="show-sticks" type="checkbox" checked /> MODE 2
              STICKS</label
            >
          </div>
          <small>START / C: KAMERA · R: RESET</small>
        </aside>
        <aside class="debug-panel" aria-label="Flight Controller Debug">
          <strong>FLIGHT CONTROLLER</strong>
          <small>ROLL / PITCH / YAW</small>
          <dl id="flight-debug"></dl>
        </aside>
      </div>
      <aside
        id="stick-visualizer"
        class="stick-visualizer"
        aria-label="Mode-2 Stick-Anzeige"
      >
        <div class="stick"><i id="left-stick"></i><span>YAW / THR</span></div>
        <div class="stick">
          <i id="right-stick"></i><span>ROLL / PITCH</span>
        </div>
      </aside>
      <button id="reset" class="reset-button">DROHNE RESETTEN</button>
      <button id="open-tuning" class="tuning-button">DROHNE TUNEN</button>
      <button id="calibrate" class="calibrate-button">INPUT KALIBRIEREN</button>
      <aside class="controller-panel" aria-label="Controller Inspector">
        <div class="controller-panel__title">
          <div>
            <span>INPUT</span>
            <h2>CONTROLLER INSPECTOR</h2>
          </div>
          <span class="live-badge">LIVE</span>
        </div>
        <div id="controllers" aria-live="polite"></div>
      </aside>
      <div id="calibration" class="wizard-layer" hidden></div>
      <div id="tuning" class="wizard-layer" hidden></div>
      <div id="loading" role="status">Simulator wird initialisiert …</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
